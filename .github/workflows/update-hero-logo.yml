name: Update homepage 3D logo
on:
  push:
    branches: [blazegeeks]
    paths: ['.github/workflows/update-hero-logo.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blazegeeks
      - name: Replace hero logo with uploaded 3D video
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<div class="stage logo-stage" id="stage" aria-label="BLAZE GEEK’s official logo"><div class="logo-plinth"><img class="hero-brand-logo" src="/assets/blaze-geeks-logo%20(2).png" data-fallback="https://raw.githubusercontent.com/blazegeek01/blazegeek01.github.io/blazegeeks/assets/blaze-geeks-logo%20(2).png" alt="Official BLAZE GEEK’s logo" width="640" height="640" loading="eager" fetchpriority="high" decoding="async">\n<img class="hero-brand-logo-shine" src="/assets/blaze-geeks-logo%20(2).png" alt="" aria-hidden="true" width="640" height="640" loading="eager" decoding="async"></div></div>'''
          new='''<div class="stage logo-stage" id="stage" aria-label="BLAZE GEEK’s 3D logo"><div class="logo-plinth"><video class="hero-3d-logo-video" autoplay muted loop playsinline webkit-playsinline preload="auto" aria-label="BLAZE GEEK’s animated 3D logo"><source src="/assets/tripo-showcase-b61738b6-d410-4f17-a957-944dada7e635.mp4" type="video/mp4"></video></div></div>'''
          if old not in s:
              raise SystemExit('Hero logo markup not found; refusing unsafe edit')
          s=s.replace(old,new,1)
          duplicate='''<a href="/ai-metadata-remover.html"><span class="menu-item-icon" aria-hidden="true">⌁</span><span>AI Metadata Remover</span><span class="menu-item-arrow" aria-hidden="true">↗</span></a>'''
          s=s.replace(duplicate,'',1)
          css='''\n<style id="blaze-hero-3d-video-final">\n#stage .logo-plinth{overflow:hidden!important;background:transparent!important;aspect-ratio:1/1!important;animation:none!important;transform:none!important;filter:none!important}\n#stage .logo-plinth:before,#stage .logo-plinth:after{display:none!important;content:none!important}\n#stage .hero-3d-logo-video{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center center!important;background:transparent!important;border:0!important;outline:0!important;box-shadow:none!important;filter:none!important}\n@media(max-width:760px){#stage .logo-plinth{width:min(92vw,390px)!important}}\n</style>\n'''
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit homepage update
        run: |
          git config user.name "BLAZE GEEK's Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Replace homepage logo with uploaded 3D animation"
          git push origin HEAD:blazegeeks

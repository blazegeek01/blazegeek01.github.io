name: Fix duplicate Quick Menu item after logo restore
on:
  push:
    branches: [blazegeeks]
    paths: ['.github/workflows/update-hero-logo.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blazegeeks
      - name: Remove duplicate Quick Menu item only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          duplicate='''<a href="/ai-metadata-remover.html"><span class="menu-item-icon" aria-hidden="true">⌁</span><span>AI Metadata Remover</span><span class="menu-item-arrow" aria-hidden="true">↗</span></a>'''
          if s.count(duplicate) != 1:
              raise SystemExit(f'Expected exactly one duplicate Quick Menu item, found {s.count(duplicate)}; refusing unsafe edit')
          s=s.replace(duplicate,'',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit Quick Menu fix
        run: |
          git config user.name "BLAZE GEEK's Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix duplicate Quick Menu item after logo restore"
          git push origin HEAD:blazegeeks

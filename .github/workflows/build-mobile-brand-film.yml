name: Build responsive brand film encodes

on:
  push:
    branches:
      - blazegeeks
    paths-ignore:
      - "assets/homepagea-motion-desktop.mp4"
      - "assets/homepagea-motion-mid.mp4"
      - "assets/homepagea-motion-mobile.mp4"

permissions:
  contents: write

concurrency:
  group: responsive-brand-film-encodes
  cancel-in-progress: false

jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: blazegeeks
          fetch-depth: 0
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Create desktop, flagship-mobile and lightweight encodes
        run: |
          set -euo pipefail
          test -s assets/homepagea-motion.mp4
          # Desktop: capped at 1280px / 30 FPS, H.264, fast-start MP4.
          ffmpeg -hide_banner -y -i assets/homepagea-motion.mp4 \
            -map 0:v:0 -an -sn -dn \
            -vf "scale='min(1280,iw)':-2:flags=lanczos,fps=30,format=yuv420p" \
            -c:v libx264 -preset medium -crf 24 -maxrate 2500k -bufsize 5000k \
            -profile:v high -level 4.1 -movflags +faststart \
            assets/homepagea-motion-desktop.mp4
          # Flagship phones and tablets, including iOS Safari: 960px / 30 FPS.
          ffmpeg -hide_banner -y -i assets/homepagea-motion.mp4 \
            -map 0:v:0 -an -sn -dn \
            -vf "scale='min(960,iw)':-2:flags=lanczos,fps=30,format=yuv420p" \
            -c:v libx264 -preset medium -crf 25 -maxrate 1600k -bufsize 3200k \
            -profile:v main -level 4.0 -movflags +faststart \
            assets/homepagea-motion-mid.mp4
          # Lower-power phones and data-saving connections: 720px / 24 FPS.
          ffmpeg -hide_banner -y -i assets/homepagea-motion.mp4 \
            -map 0:v:0 -an -sn -dn \
            -vf "scale='min(720,iw)':-2:flags=lanczos,fps=24,format=yuv420p" \
            -c:v libx264 -preset medium -crf 29 -maxrate 850k -bufsize 1700k \
            -profile:v baseline -level 3.0 -movflags +faststart \
            assets/homepagea-motion-mobile.mp4
          ls -lh assets/homepagea-motion*.mp4
      - name: Commit responsive encodes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/homepagea-motion-desktop.mp4 assets/homepagea-motion-mid.mp4 assets/homepagea-motion-mobile.mp4
          if git diff --cached --quiet; then
            echo "Responsive video encodes are already current."
            exit 0
          fi
          git commit -m "Add responsive optimized brand film encodes"
          for attempt in 1 2 3 4 5; do
            git fetch origin blazegeeks
            git rebase origin/blazegeeks
            if git push origin HEAD:blazegeeks; then exit 0; fi
            sleep 2
          done
          echo "Could not push generated video files after five attempts."
          exit 1

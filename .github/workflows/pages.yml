name: Deploy BLAZE GEEK’s website to GitHub Pages

on:
  push:
    branches: ["blazegeeks"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static website
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R ./*.html _site/
          if [ -d assets ]; then cp -R assets _site/assets; fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path('_site/ai-metadata-remover.html')
          s = p.read_text(encoding='utf-8')

          # Keep the exact original BLAZE GEEK’s text/mark branding in header and footer.
          old_logo = '<a class="logo official-site-logo" href="/"><img src="/assets/blaze-geeks-logo%20(2).png" alt="BLAZE GEEK’S official logo"></a>'
          original_logo = '<a class="logo" href="/"><span class="brandmark">ϟ</span><span>BLAZE <b>GEEK’S</b></span></a>'
          s = s.replace(old_logo, original_logo)

          # Also undo the previous source branding replacement if present.
          old_source_logo = '<a class="logo" href="/"><span class="brandmark">ϟ</span><span>BLAZE <b>GEEK’S</b></span></a>'
          s = s.replace(old_source_logo, original_logo)

          # Remove the standalone body logo/hero artwork completely.
          marker = '<div class="hero-art">'
          start = s.find(marker)
          if start != -1:
              pos = start
              depth = 0
              while pos < len(s):
                  open_pos = s.find('<div', pos)
                  close_pos = s.find('</div>', pos)
                  if close_pos == -1:
                      raise SystemExit('Could not find closing hero-art div')
                  if open_pos != -1 and open_pos < close_pos:
                      depth += 1
                      pos = open_pos + 4
                  else:
                      depth -= 1
                      pos = close_pos + 6
                      if depth == 0:
                          s = s[:start] + s[pos:]
                          break

          # Keep the tool body clean without changing the original header/footer branding.
          extra_css = '''\n.hero{grid-template-columns:1fr;max-width:1050px;text-align:center}.hero .lead{margin-left:auto;margin-right:auto;max-width:760px}.hero .privacy{justify-content:center}.hero-art,.hero-index{display:none!important}\n'''
          s = s.replace('</style>', extra_css + '</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
